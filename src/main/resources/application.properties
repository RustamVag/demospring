spring.application.name=demo
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:demospring}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456789}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.liquibase.enabled=${LIQUIBASE_ENABLED:true}
spring.liquibase.change-log=${LIQUIBASE_CHANGELOG:classpath:db/changelog/db.changelog-master.yaml}
spring.liquibase.contexts=${LIQUIBASE_CONTEXTS:}
spring.liquibase.default-schema=${LIQUIBASE_SCHEMA:}
spring.liquibase.liquibase-schema=${LIQUIBASE_LIQUIBASE_SCHEMA:}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT:30000}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info}