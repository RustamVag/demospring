  services:
    postgres:
      image: postgres:16-alpine
      container_name: demo-postgres
      restart: unless-stopped
      environment:
        POSTGRES_DB: ${DB_NAME:-demo}
        POSTGRES_USER: ${DB_USER:-demo}
        POSTGRES_PASSWORD: ${DB_PASSWORD:-demo}
        PGDATA: /var/lib/postgresql/data/pgdata
      command: >
        postgres
          -c max_connections=${PG_MAX_CONNECTIONS:-100}
          -c shared_buffers=${PG_SHARED_BUFFERS:-256MB}
          -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}
          -c work_mem=${PG_WORK_MEM:-4MB}
          -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
          -c log_min_duration_statement=${PG_LOG_MIN_DURATION:-1000}
      volumes:
        - pgdata:/var/lib/postgresql/data
      ports:
        - "${DB_EXTERNAL_PORT:-5432}:5432"
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-demo} -d ${DB_NAME:-demo}" ]
        interval: 10s
        timeout: 5s
        retries: 5
      networks:
        - demo-net

    app:
      build:
        context: .
        dockerfile: Dockerfile
      image: demo-app:latest
      container_name: demo-app
      restart: unless-stopped
      depends_on:
        postgres:
          condition: service_healthy
      environment:
        DB_HOST: postgres
        DB_PORT: 5432
        DB_NAME: ${DB_NAME:-demo}
        DB_USER: ${DB_USER:-demo}
        DB_PASSWORD: ${DB_PASSWORD:-demo}

        DB_POOL_MAX: ${DB_POOL_MAX:-10}
        DB_POOL_MIN: ${DB_POOL_MIN:-2}
        DB_CONN_TIMEOUT: ${DB_CONN_TIMEOUT:-30000}

        JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
        JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}

        LIQUIBASE_ENABLED: ${LIQUIBASE_ENABLED:-true}
        LIQUIBASE_CHANGELOG: ${LIQUIBASE_CHANGELOG:-classpath:db/changelog/db.changelog-master.yaml}
        LIQUIBASE_CONTEXTS: ${LIQUIBASE_CONTEXTS:-}
        LIQUIBASE_SCHEMA: ${LIQUIBASE_SCHEMA:-}

        SERVER_PORT: 8080
        LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
        LOG_LEVEL_SPRING: ${LOG_LEVEL_SPRING:-INFO}
        FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}

        JAVA_OPTS: "${JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseG1GC}"
      ports:
        - "${APP_EXTERNAL_PORT:-8080}:8080"
      healthcheck:
        test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
        interval: 15s
        timeout: 5s
        retries: 5
        start_period: 40s
      networks:
        - demo-net

  volumes:
    pgdata:
      driver: local

  networks:
    demo-net:
      driver: bridge